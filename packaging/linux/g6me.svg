<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Eight speaker positions collapsing into a pair of headphones: the whole
       program in one glyph. Dark rounded square so it reads on light and dark
       taskbars alike. -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="#141a21"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#2c3a46" stroke-width="2"/>

  <!-- the eight input slots, arranged like a 7.1 bed -->
  <g fill="#4fc3a1">
    <circle cx="26" cy="30" r="6"/>
    <circle cx="58" cy="22" r="6"/>
    <circle cx="26" cy="64" r="6"/>
    <circle cx="20" cy="94" r="5"/>
    <circle cx="58" cy="106" r="6"/>
    <circle cx="86" cy="100" r="5"/>
    <circle cx="86" cy="28" r="5"/>
    <circle cx="58" cy="64" r="5" fill="#3a8f78"/>
  </g>

  <!-- the matrix: every input into two sums -->
  <g stroke="#4fc3a1" stroke-width="2" opacity="0.55" fill="none">
    <path d="M26 30 L100 54"/>
    <path d="M58 22 L100 54"/>
    <path d="M26 64 L100 54"/>
    <path d="M20 94 L100 74"/>
    <path d="M58 106 L100 74"/>
    <path d="M86 100 L100 74"/>
    <path d="M86 28 L100 54"/>
    <path d="M58 64 L100 64"/>
  </g>

  <!-- L and R -->
  <g fill="#e8f0f2">
    <circle cx="104" cy="54" r="8"/>
    <circle cx="104" cy="74" r="8"/>
  </g>
  <g fill="#141a21" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">
    <text x="104" y="57">L</text>
    <text x="104" y="77">R</text>
  </g>
</svg>
