name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `--locked` everywhere: this workspace ships binaries, so the committed
  # Cargo.lock is part of what is being tested.
  RUSTFLAGS: ""

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        # libasound2-dev: cpal's ALSA backend (g6me-core's `monitor` feature).
        # The rest are what winit/eframe link against for a Wayland/X11 build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev \
            libxcb1-dev libx11-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev
      - run: cargo fmt --check --all
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace
      - run: cargo test --locked --workspace
      # The evidence: builds vendor/g6ct in eight configurations and compares.
      # --require-all makes any skip a failure, so a missing C compiler cannot
      # quietly turn the numerical contract back into a no-op.
      - name: Bit-exactness verification
        run: cargo run --locked --release -p g6me-verify -- --require-all
      - name: Capabilities probe (smoke)
        run: ./target/release/g6me --caps

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Tests skip when ffmpeg/flac are absent, so this only buys coverage — but it
      # buys the *whole* render path on Windows, which is where the release binaries
      # for that platform run. If the package manager hiccups, the suite still runs.
      - name: ffmpeg and flac on PATH
        continue-on-error: true
        run: choco install ffmpeg flac -y --no-progress
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --workspace
      - run: cargo test --locked --workspace
      # Deliberately not --require-all here: the reference comparisons need a C
      # compiler on PATH, and MSVC runners do not guarantee one. A missing compiler
      # must read as "these checks did not run on this target", not as a green light,
      # so the hard gate lives in the msys2 job, which installs gcc explicitly.
      - name: Bit-exactness verification (skips reported, not fatal)
        run: cargo run --locked --release -p g6me-verify

  # The optimized flavour: the same numerical contract under explicit x86-64-v3
  # codegen. If FMA contraction ever appeared in the DSP, this job is what catches
  # it — the generic job above would stay green.
  linux-v3:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3 -C opt-level=3 -C llvm-args=-unroll-threshold=1000"
      CARGO_TARGET_DIR: target-v3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev \
            libxcb1-dev libx11-dev libxcursor-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev
      - run: >-
          cargo build --locked --release --workspace
          --config 'profile.release.lto="thin"'
          --config 'profile.release.codegen-units=1'
      - name: Bit-exactness verification (x86-64-v3)
        run: ./target-v3/release/g6me-verify --require-all

  # The GNU target is what a Windows user without Visual Studio builds, and what
  # scripts/release.sh cross-builds for the release zip — so prove it from Linux,
  # where the mingw toolchain is a package and not a shell-PATH lottery. (An earlier
  # version of this job ran inside msys2 and died with exit 127: `cargo` was on the
  # Windows PATH, which the msys2 login shell does not inherit the way you expect.)
  windows-gnu:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 binutils-mingw-w64-x86-64
      - run: cargo build --locked --release --target x86_64-pc-windows-gnu --workspace
      # Same guard as the release script, on the binary this target actually ships:
      # an instruction count is asserted too, because a scan that decoded nothing
      # would also report zero FMA and read as a pass.
      - name: No FMA in the Windows binaries
        run: |
          for f in target/x86_64-pc-windows-gnu/release/g6me.exe \
                   target/x86_64-pc-windows-gnu/release/g6me-gui.exe; do
            ins=$(x86_64-w64-mingw32-objdump -d "$f" | grep -cE '^ ') || ins=0
            fma=$(x86_64-w64-mingw32-objdump -d "$f" | grep -cE '\b(vfmadd|vfmsub|vfnmadd|vfnmsub)' || true)
            echo "$(basename "$f"): ins=$ins fma=$fma"
            test "$ins" -gt 1000 || { echo "cannot disassemble $f" >&2; exit 1; }
            test "$fma" -eq 0 || { echo "FMA in $f" >&2; exit 1; }
          done
