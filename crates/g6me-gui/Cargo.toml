[package]
name = "g6me-gui"
description = "G6 Media Encoder (G6ME) desktop app: queue, per-file meters, format controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "g6me-gui"
path = "src/main.rs"

[dependencies]
g6me-core = { workspace = true }
serde_json.workspace = true
# eframe's default features already cover the three platforms this project
# promises: winit's X11 and Wayland backends, native Windows, and AccessKit for
# screen readers. Keeping them default rather than hand-picked means an
# upgrade cannot silently drop one.
eframe = "0.31"
egui = "0.31"

# Native OS file dialogs: Win32 COM on Windows, Cocoa on macOS, and pure-Rust
# XDG Desktop Portal (`xdg-portal`) on Linux (works on KDE, GNOME, Hyprland,
# Sway/Wayland, and X11 with zero GTK C library dependency). Builds with
# `--no-default-features` fall back cleanly to the built-in egui browser.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"], optional = true }


[features]
# No `monitor` feature here on purpose: this app never opens an audio device. The
# levels come from taps on the render itself, which needs no cpal, no device and
# no portal — see `g6me_core::meter::MeterTap`.
default = ["native-dialogs"]
native-dialogs = ["dep:rfd"]
